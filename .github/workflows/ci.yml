name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      playwright_pages_ready: ${{ steps.upload_playwright_pages.outcome == 'success' }}
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      DISABLE_EMAIL: 'true'
      CI: 'true'
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Start test server
        run: yarn dev > /tmp/next.log 2>&1 &
      - name: Wait for test server
        run: npx wait-on http://localhost:3000 --timeout 60000
      - name: Run Playwright tests
        run: yarn playwright:test
        env:
          BASE_URL: http://localhost:3000
      - name: Upload Playwright report for GitHub Pages
        id: upload_playwright_pages
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/
      - name: Run Percy snapshots
        if: ${{ !cancelled() && env.PERCY_TOKEN != '' }}
        run: |
          npx percy exec -- yarn playwright:visual
          npx percy build:wait --project cade7b74/fgacic.com-27688392 --commit "$PERCY_COMMIT" --timeout 900000
        env:
          BASE_URL: http://localhost:3000
          PERCY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 smoke test
        run: k6 run k6/smoke.js
        env:
          BASE_URL: http://localhost:3000
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report/
            k6-report.html
            /tmp/next.log
          if-no-files-found: ignore

  deploy-playwright-report:
    needs: test
    if: ${{ always() && needs.test.outputs.playwright_pages_ready == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
